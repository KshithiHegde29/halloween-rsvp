<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14101c"><title>Dead Man's Midnight: RSVP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap">
<style>
:root{--bg:#14101c;--fg:#f3ead8;--ac:#ff7a1a;--mu:#c9bfd6;--ln:#3a3050;--panel:#1d1729}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:18px/1.5 "Special Elite",monospace;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 30% 20%,#3b1d5a55,transparent 40%),radial-gradient(circle at 80% 80%,#ff7a1a22,transparent 40%);animation:drift 14s ease-in-out infinite alternate;z-index:-1}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1,h2{font-family:Creepster,cursive;font-weight:400;color:var(--ac);margin:0;letter-spacing:1px}
h1{font-size:clamp(46px,13vw,76px);line-height:.95;text-align:center;animation:flick 5s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}98%{opacity:.6}}
h2{font-size:clamp(30px,8vw,40px);margin-bottom:6px}
.sub{text-align:center;color:var(--mu);margin:8px 0 18px}
.info{border:2px dashed var(--ac);padding:12px 16px;margin-bottom:18px;text-align:center}
.bar{height:8px;background:var(--ln);margin-bottom:22px}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.card{background:var(--panel);border:1px solid var(--ln);padding:22px;animation:rise .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.q{margin:0 0 14px;color:var(--mu)}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:#120e1a;border:2px solid var(--ln);padding:12px;min-height:48px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{font:inherit;color:var(--fg);background:transparent;border:2px solid var(--ac);min-height:48px;padding:10px 16px;cursor:pointer}
button.go{background:var(--ac);color:#14101c;font-weight:bold}
button:hover{filter:brightness(1.2)}
.choice{display:block;width:100%;text-align:left;margin-bottom:10px}
.choice[aria-pressed=true]{background:var(--ac);color:#14101c}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips button{font-size:14px;min-height:40px;border-color:var(--ln)}
.row{display:flex;gap:10px;margin-top:18px}.row button{flex:1}
.err{color:#ffb38a;margin:10px 0 0;min-height:1.4em}
.prev{display:block;max-width:100%;max-height:260px;margin:14px auto 0;border:3px solid var(--fg);filter:grayscale(1) contrast(1.1)}
.wanted{font-family:Creepster,cursive;color:var(--ac);text-align:center;font-size:30px;margin-top:6px}
.hp{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Mobile fixes (Android + iPhone) ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;background:#14101c;color-scheme:dark}
body{min-height:100vh;min-height:100dvh;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body::before{inset:0;animation-name:drift2}
@keyframes drift2{to{transform:scale(1.08)}}
main{width:100%;padding:calc(24px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
input[type=text],textarea,button{-webkit-appearance:none;appearance:none;border-radius:0;font-size:16px}
button{touch-action:manipulation;line-height:1.3;min-height:48px}
button:disabled{opacity:.7;cursor:wait}
.choice{white-space:normal;line-height:1.35}
.chips button{white-space:normal;text-align:left;max-width:100%;min-height:44px}
input[type=file]{width:100%;font-size:16px;color:var(--mu)}
input[type=file]::file-selector-button{font:inherit;font-size:16px;min-height:48px;padding:10px 16px;margin-right:12px;color:#14101c;background:var(--ac);border:2px solid var(--ac);border-radius:0;cursor:pointer}
.prev{max-height:50vh;width:auto;object-fit:contain}
.info{font-size:15px;line-height:1.4}
@media (max-width:480px){
 body{font-size:17px}
 .card{padding:18px 16px}
 h1{font-size:clamp(40px,13vw,60px)}
 h2{font-size:clamp(28px,8.5vw,34px)}
 .row{gap:8px}
}
@media (max-width:340px){.row{flex-direction:column-reverse}}
 .ex{display:block;width:100%;padding:8px 12px;margin-bottom:8px;border:1px dashed var(--ln);color:var(--mu);font-size:15px;line-height:1.35;font-style:italic;-webkit-user-select:none;user-select:none;pointer-events:none}
.chips{display:block}
</style>
</head>
<body>
<main>
<h1>Dead Man's Midnight</h1>
<p class="sub">A murder mystery. One of you is the killer.</p>
<div class="info" id="info"></div>
<div class="bar" aria-hidden="true"><i id="pg"></i></div>
<div id="app" aria-live="polite"></div>
<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
</main>
<script>
// ===== EDIT THESE =====
var CONFIG = {
  scriptUrl: "https://script.google.com/macros/s/AKfycbxdpMeOTZOmztcV1ZcRgP9njoo9qBMF8KcRkIRzhwseob7ZoXAyBDWUd1OOklpgx2uNWg/exec",
  token: "halloween-2026",   // same as TOKEN in Code.gs
  date: "31st October", time: "7 PM", place: "121 34Th st, Union city, NJ", deadline: "today lol"
};
// ======================
var A = {}, step = 0, photoB64 = "";
var steps = [
 {k:"name", t:"text", h:"State your name, suspect.", q:"The ghosts need to know who to blame."},
 {k:"answer", t:"choice", h:"Will you attend?", q:"Choose wisely.", o:["I'll be there, dead or alive","I'll haunt you from afar (can't come)","Maybe. Ask my ghost."]},
 {k:"bring", t:"info", h:"Bring your own everything", q:"The ghosts do not cook and the skeletons have no stomachs. So bring your own food, drink, or whatever keeps you alive until midnight."},
 {k:"secret", t:"text", h:"Confess one spooky secret.", q:"Silly or dramatic, nothing truly private. I'll use it in the game.", c:["I talk to my plants when no one is around","I'm secretly afraid of pumpkins","I once hid in a wardrobe to skip a party","I never finished a horror movie"]},
 {k:"photo", t:"photo", h:"Show us your face.", q:"Upload one clear photo of your face. Your most guilty look is welcome."},
 {k:"photoNote", t:"text", h:"What is your most suspicious habit?", q:"Tell me the funny crime you are most likely to commit at a party.", c:["Stealing the last pizza slice","Laughing at funerals","Leaving a haunted house smiling"]},
 {k:"costume", t:"choice", h:"Costume check.", q:"Costume is compulsory. No costume, no entry.", o:["I swear on my life I'll wear a costume","I have a costume. It's terrifying. You'll see.","Costume is compulsory? Fine. I'm on it."]}
];
var app = document.getElementById("app");
document.getElementById("info").textContent = CONFIG.date + " at " + CONFIG.time + " · " + CONFIG.place + " · RSVP by " + CONFIG.deadline;
function el(tag, props, kids){var e=document.createElement(tag);for(var p in props||{})e[p]=props[p];(kids||[]).forEach(function(k){e.appendChild(typeof k==="string"?document.createTextNode(k):k)});return e}
function progress(){document.getElementById("pg").style.width=(step/(steps.length))*100+"%"}
function render(){
  progress(); app.textContent="";
  if(step>=steps.length){return review()}
  var s=steps[step], card=el("div",{className:"card"}), err=el("p",{className:"err",role:"alert"});
  card.appendChild(el("h2",{textContent:s.h})); card.appendChild(el("p",{className:"q",textContent:s.q}));
  var getVal;
  if(s.t==="text"){
    var inp=el("input",{type:"text",maxLength:200,value:A[s.k]||"",ariaLabel:s.h}); inp.setAttribute("aria-label",s.h);
    card.appendChild(inp); getVal=function(){return inp.value.trim()};
    if(s.c){var ch=el("div",{className:"chips"});s.c.forEach(function(c){ch.appendChild(el("span",{className:"ex",textContent:c}))});card.appendChild(el("p",{className:"q",textContent:"Examples (don't copy these, make up your own):",style:"margin:14px 0 0"}));card.appendChild(ch)}
  } else if(s.t==="choice"){
    var sel=A[s.k]||""; var bs=[];
    s.o.forEach(function(o){var b=el("button",{type:"button",className:"choice",textContent:o});b.setAttribute("aria-pressed",String(o===sel));b.onclick=function(){sel=o;bs.forEach(function(x){x.setAttribute("aria-pressed",String(x===b))})};bs.push(b);card.appendChild(b)});
    getVal=function(){return sel};
    } else if(s.t==="info"){
    getVal=function(){return "seen"};
  } else {
    var f=el("input",{type:"file",accept:"image/*"}); f.setAttribute("aria-label","Choose a photo of your face");
    var pv=el("img",{className:"prev",alt:"Your mugshot preview"}); pv.hidden=!photoB64; if(photoB64)pv.src="data:image/jpeg;base64,"+photoB64;
    var wl=el("div",{className:"wanted",textContent:"WANTED"}); wl.hidden=!photoB64;
    f.onchange=function(){var file=f.files[0];if(!file)return;shrink(file,function(b64){photoB64=b64;pv.src="data:image/jpeg;base64,"+b64;pv.hidden=false;wl.hidden=false;err.textContent=""},function(){err.textContent="That file could not be read. Try another photo."})};
    card.appendChild(f);card.appendChild(wl);card.appendChild(pv);getVal=function(){return photoB64};
  }
  card.appendChild(err);
  var row=el("div",{className:"row"});
  if(step>0)row.appendChild(el("button",{type:"button",textContent:"Back",onclick:function(){A[s.k]=getVal();step--;render()}}));
  row.appendChild(el("button",{type:"button",className:"go",textContent:"Next",onclick:function(){var v=getVal();if(!v){err.textContent="You can't skip this one, suspect.";return}if(s.c&&s.c.some(function(x){return x.toLowerCase()===v.toLowerCase()})){err.textContent="That one is just an example. Make up your own, suspect.";return}A[s.k]=v;if(s.k==="answer"&&v.indexOf("afar")>-1){persuade();return}step++;render()}}));
  card.appendChild(row); app.appendChild(card);
  var first=card.querySelector("input[type=text]"); if(first)first.focus();
}
function shrink(file,ok,bad){
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var m=900,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.8).split(",")[1])};
  img.onerror=bad; img.src=u;
}
function persuade(){
  progress(); app.textContent="";
  var card=el("div",{className:"card"}), err=el("p",{className:"err",role:"alert"});
  card.appendChild(el("h2",{textContent:"Not so fast, "+A.name+"."}));
  card.appendChild(el("p",{className:"q",textContent:"The ghosts already set a place for you at the table. The skeletons are coming and they have no stomachs, so you cannot lose the snack contest to them. Also, the killer needs at least one person to blame, and you are the perfect fit."}));
  card.appendChild(el("p",{className:"q",textContent:"Think again. Your costume is probably better than Anirudh's anyway."}));
  var row=el("div",{className:"row"});
  row.appendChild(el("button",{type:"button",className:"go",textContent:"Fine, I'll come",onclick:function(){A.answer="I'll be there, dead or alive";step=2;render()}}));
  var no=el("button",{type:"button",textContent:"Still no",onclick:function(){
    no.disabled=true;
    fetch(CONFIG.scriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:CONFIG.token,hp:document.getElementById("hp").value,name:A.name,answer:A.answer})}).then(declined).catch(function(){no.disabled=false;err.textContent="The spirits lost your message. Try again."});
  }});
  row.appendChild(no);card.appendChild(row);card.appendChild(err);app.appendChild(card);
}
function declined(){
  document.getElementById("pg").style.width="100%"; app.textContent="";
  var card=el("div",{className:"card"});
  card.appendChild(el("h2",{textContent:"Your chair stays empty."}));
  card.appendChild(el("p",{className:"q",textContent:"Very well, "+A.name+". We will haunt you from afar. Sleep lightly, and check your closet tonight."}));
  app.appendChild(card);
}
function review(){
  var card=el("div",{className:"card"}), err=el("p",{className:"err",role:"alert"});
  card.appendChild(el("h2",{textContent:"Sign your confession"}));
  card.appendChild(el("p",{className:"q",textContent:A.name+" · "+A.answer}));
  var row=el("div",{className:"row"});
  row.appendChild(el("button",{type:"button",textContent:"Back",onclick:function(){step=steps.length-1;render()}}));
  var note=el("p",{className:"q",role:"status",textContent:""});
  note.style.color="#ff7a1a";
  var go=el("button",{type:"button",className:"go",textContent:"Send my RSVP",onclick:function(){
    go.disabled=true;go.textContent="Sending...";
    note.textContent="Sending... (I vibe coded this so obv it takes some time to send, dont reload the page lol thx)";
    var body=JSON.stringify({token:CONFIG.token,hp:document.getElementById("hp").value,name:A.name,answer:A.answer,secret:A.secret,photoNote:A.photoNote,costume:A.costume,photo:photoB64});
    fetch(CONFIG.scriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body}).then(done).catch(function(){go.disabled=false;go.textContent="Send my RSVP";note.textContent="";err.textContent="Could not send. Check your connection and try again."});
  }});
  row.appendChild(go);card.appendChild(row);card.appendChild(note);card.appendChild(err);app.appendChild(card);
}
function done(){
  document.getElementById("pg").style.width="100%"; app.textContent="";
  var card=el("div",{className:"card"});
  card.appendChild(el("h2",{textContent:"Your fate is sealed."}));
  card.appendChild(el("p",{className:"q",textContent:A.answer.indexOf("be there")>-1?"See you at midnight, "+A.name+". Wear your costume. Trust no one.":"Thanks, "+A.name+". Your answer has been recorded."}));
  app.appendChild(card);
}
render();
</script>
</body>
</html>
